    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        html, body { width: 100%; min-height: 100%; background: #f8fafc; color: #1e293b; }
        body { height: 100dvh; overflow: hidden; }
        #app { display: grid; grid-template-columns: minmax(320px, 42%) minmax(0, 58%); width: 100%; height: 100dvh; }
        #interfaz { min-width: 0; height: 100%; overflow-y: auto; padding: 20px 16px; background: #fff; box-shadow: 2px 0 12px rgba(15,23,42,.10); z-index: 2; }
        #interfaz h1 { font-size: clamp(18px, 2vw, 25px); line-height: 1.25; text-align: center; margin-bottom: 12px; }
        #estado { font-size: 14px; line-height: 1.5; margin-bottom: 14px; padding: 10px 12px; border-radius: 10px; background: #f1f5f9; overflow-wrap: anywhere; }
        .controles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
        button { padding: 10px 8px; border: 0; border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 700; line-height: 1.25; transition: transform .15s, opacity .15s; }
        button:hover { transform: translateY(-1px); }
        button:disabled { opacity: .55; cursor: wait; }
        #contenedor-escena { position: relative; min-width: 0; min-height: 0; width: 100%; height: 100%; overflow: hidden; background: #111827; }
        #contenedor-escena:empty::before { content: 'La cámara aparecerá aquí'; position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; color: #cbd5e1; text-align: center; font-size: 18px; }
        #contenedor-escena a-scene { position: absolute !important; inset: 0 !important; width: 100% !important; height: 100% !important; }
        #contenedor-escena canvas { display: block; }
        #contenedor-escena video { object-fit: cover !important; }
        @media (max-width: 700px) {
            body { overflow: hidden; }
            #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 46%) minmax(0, 54%); }
            #interfaz { height: 100%; padding: 10px; box-shadow: 0 2px 10px rgba(15,23,42,.1); }
            #interfaz h1 { font-size: 17px; margin-bottom: 7px; }
            #estado { font-size: 12px; padding: 7px 9px; margin-bottom: 8px; }
            .controles { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
            button { padding: 8px 4px; font-size: 11px; }
        }
        @media (max-width: 380px) { .controles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    </style>
</head>

        // ==========================================
        // ELEMENTOS DE LA INTERFAZ Y CONTROL DE ESCENAS

        const contenedorEscena = document.getElementById("contenedor-escena");
        const estado = document.getElementById("estado");
        const botonReiniciar = document.getElementById("btnReiniciar");
        const botonesImagen = document.querySelectorAll("button[data-imagen]");

        let escenaActual = null;
        let cargando = false;
        let escenaSeleccionada = null;

        function mostrarEstado(texto, color = "#475569") {
            estado.textContent = texto;
            estado.style.color = color;
        }

        function bloquearBotones(bloquear) {
            botonesImagen.forEach(boton => boton.disabled = bloquear);
            botonReiniciar.disabled = bloquear;
        }

        async function detenerEscena() {
            const anterior = escenaActual;
            escenaActual = null;
            if (!anterior) return;

            try {
                const sistema = anterior.systems && anterior.systems["mindar-image-system"];
                if (sistema && typeof sistema.stop === "function") {
                    await sistema.stop();
                }
            } catch (error) {
                console.warn("MindAR no se detuvo de forma normal:", error);
            }

            if (anterior.parentNode) anterior.parentNode.removeChild(anterior);
        }

        async function cargarImagen(id) {
            if (cargando) return;
            if (!mensajes[id] || !escenas[id]) {
                mostrarEstado("❌ No se encontró el contenido de esta escena.", "#dc2626");
                return;
            }
            if (!window.isSecureContext) {
                mostrarEstado("❌ Abre esta página con HTTPS para usar la cámara.", "#dc2626");
                return;
            }
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                mostrarEstado("❌ Este navegador no permite acceder a la cámara. Prueba con Chrome actualizado.", "#dc2626");
                return;
            }

            cargando = true;
            escenaSeleccionada = id;
            bloquearBotones(true);
            mostrarEstado("⏳ Preparando la escena " + id + " y activando la cámara…", "#2563eb");

            try {
                // Detener la escena anterior antes de crear otra para evitar dos cámaras activas.
                await detenerEscena();
                contenedorEscena.innerHTML = "";

                const rutaMind = `./imagen1/imagen${id}/Imagen${id}.mind`;
                const escena = document.createElement("a-scene");
                escena.setAttribute("mindar-image", `imageTargetSrc: ${rutaMind}; autoStart: true; filterMinCF: 0.001; filterBeta: 0.001`);
                escena.setAttribute("embedded", "");
                escena.setAttribute("color-space", "sRGB");
                escena.setAttribute("renderer", "colorManagement: true; antialias: false; physicallyCorrectLights: false");
                escena.setAttribute("vr-mode-ui", "enabled: false");
                escena.setAttribute("device-orientation-permission-ui", "enabled: false");

                const camara = document.createElement("a-camera");
                camara.setAttribute("position", "0 0 0");
                camara.setAttribute("look-controls", "enabled: false");
                camara.setAttribute("wasd-controls", "enabled: false");
                escena.appendChild(camara);

                const objetivo = document.createElement("a-entity");
                objetivo.setAttribute("mindar-image-target", "targetIndex: 0");
                objetivo.innerHTML = escenas[id];
                escena.appendChild(objetivo);

                objetivo.addEventListener("targetFound", () => {
                    if (escenaSeleccionada !== id) return;
                    mostrarEstado("✅ " + mensajes[id], "#059669");
                });
                objetivo.addEventListener("targetLost", () => {
                    if (escenaSeleccionada !== id) return;
                    mostrarEstado("🔍 Imagen fuera de cámara. Vuelve a enfocarla.", "#b45309");
                });
                escena.addEventListener("arReady", () => {
                    if (escenaSeleccionada !== id) return;
                    mostrarEstado("📷 Cámara lista. Enfoca la imagen de la opción seleccionada.", "#2563eb");
                });
                escena.addEventListener("arError", event => {
                    console.error("Error de MindAR:", event.detail || event);
                    if (escenaSeleccionada !== id) return;
                    mostrarEstado(`❌ No se pudo iniciar la cámara o cargar ${rutaMind}. Comprueba que el archivo exista y que el permiso de cámara esté habilitado.`, "#dc2626");
                });

                escenaActual = escena;
                contenedorEscena.appendChild(escena);
            } catch (error) {
                console.error("Error al cargar la escena:", error);
                mostrarEstado("❌ Ocurrió un error al iniciar la realidad aumentada. Revisa la consola del navegador.", "#dc2626");
            } finally {
                cargando = false;
                bloquearBotones(false);
            }
        }

        botonesImagen.forEach(boton => {
            boton.addEventListener("click", () => cargarImagen(boton.dataset.imagen));
        });

        botonReiniciar.addEventListener("click", async () => {
            if (cargando) return;
            cargando = true;
            bloquearBotones(true);
            escenaSeleccionada = null;
            mostrarEstado("🔄 Cerrando la cámara…", "#475569");
            try {
                await detenerEscena();
                contenedorEscena.innerHTML = "";
                mostrarEstado("🔍 Selecciona una imagen para iniciar la cámara.");
            } catch (error) {
                console.error("Error al reiniciar:", error);
                mostrarEstado("❌ No se pudo reiniciar. Recarga la página.", "#dc2626");
            } finally {
                cargando = false;
                bloquearBotones(false);
            }
        });
    </script>

</body>
</html>
